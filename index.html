<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShezMusic</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <h2>🎵 ShezMusic</h2>

    <ul>
        <li><i class="fa-solid fa-house"></i> Home</li>
        <li><i class="fa-solid fa-heart"></i> Favorites</li>
        <li><i class="fa-solid fa-list"></i> Playlist</li>
        <li><i class="fa-solid fa-music"></i> Hindi</li>
        <li><i class="fa-solid fa-globe"></i> English</li>
        <li><i class="fa-solid fa-moon"></i> Lo-Fi</li>
    </ul>

</div>

<!-- Main -->

<div class="main">

    <div class="topbar">

        <input
        type="text"
        id="search"
        placeholder="🔍 Search Songs...">

    </div>

    <div class="song-list" id="songList">

    </div>

</div>

<!-- Player -->

<div class="player">

    <img id="cover"
    src="covers/pawan.jpg"
    alt="Cover">

    <div class="song-info">

        <h3 id="title">No Song Selected</h3>

        <p id="artist">
            Select a song to play
        </p>

    </div>

    <div class="player-right">

        <div class="controls">

            <button id="prev">
                <i class="fa-solid fa-backward-step"></i>
            </button>

            <button id="play">
                <i class="fa-solid fa-play"></i>
            </button>

            <button id="next">
                <i class="fa-solid fa-forward-step"></i>
            </button>

        </div>

        <div class="progress-container">

            <span id="currentTime">0:00</span>

            <input
            type="range"
            id="progress"
            value="0"
            min="0"
            max="100">

            <span id="duration">0:00</span>

        </div>

    </div>

    <audio id="audio"></audio>

</div>

<script src="songs.js"></script>
<script src="script.js"></script>

</body>
</html>
